<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Entregas - Flores del Valle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: menu}"></div>

    <div class="container my-4 flex-grow-1">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-2 border-bottom">
            <div>
                <h2 class="fw-bold text-success mb-1">
                    <i class="bi bi-truck me-2"></i>Gestión de Entregas y Rutas de Despacho
                </h2>
                <p class="text-muted mb-0">Asignación de conductores, optimización de rutas y seguimiento en tiempo real de pedidos.</p>
            </div>
            <div class="mt-3 mt-md-0">
                <span class="badge bg-primary fs-6 px-3 py-2">
                    En ruta activa: <strong th:text="${enRuta}"></strong> entregas
                </span>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="e : ${entregas}">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3" style="background-color: #1b4332 !important;">
                        <span class="fw-bold" th:text="'Entrega #' + ${e.id}">Entrega</span>
                        <span th:if="${e.estadoEntrega == 'Entregado'}" class="badge bg-success">Entregado</span>
                        <span th:if="${e.estadoEntrega == 'En ruta'}" class="badge bg-warning text-dark">En ruta</span>
                        <span th:if="${e.estadoEntrega == 'Pendiente'}" class="badge bg-secondary">Pendiente</span>
                    </div>
                    <div class="card-body">
                        <h6 class="fw-bold text-dark mb-2"><i class="bi bi-person me-2 text-success"></i><span th:text="${e.clienteNombre}">Cliente</span></h6>
                        <p class="small text-muted mb-2"><i class="bi bi-geo-alt me-2 text-danger"></i><strong th:text="${e.direccionEntrega}">Dirección</strong></p>
                        <p class="small text-secondary mb-2"><i class="bi bi-map me-2 text-info"></i>Zona: <span th:text="${e.rutaZona}"></span></p>
                        <div class="p-3 bg-light rounded-3 border mt-3">
                            <div class="small text-muted"><strong>Conductor Asignado:</strong></div>
                            <div class="fw-bold text-primary mb-1"><i class="bi bi-person-badge me-1"></i><span th:text="${e.conductorAsignado}"></span></div>
                            <div class="small text-muted"><i class="bi bi-clock me-1"></i>Horario estimado: <span th:text="${e.horarioEstimado}"></span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: pie}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
